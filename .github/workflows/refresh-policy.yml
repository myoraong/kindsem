name: Refresh tax rates from 법제처

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh tax rates from 법제처
        env:
          POLICY_STRICT: "1"
        run: |
          node scripts/refresh-policy.mjs && exit 0
          echo "1차 실패, 8초 후 재시도"
          sleep 8
          node scripts/refresh-policy.mjs && exit 0
          echo "2차 실패, 16초 후 재시도"
          sleep 16
          node scripts/refresh-policy.mjs
      - id: commit
        name: Commit if rates changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/policy.generated.ts public/policy.json
          if git diff --staged --quiet; then
            echo "세율 변동 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh tax brackets from 법제처."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN 푸시는 다른 워크플로를 안 깨우므로, 여기 배포가 사이트를 올립니다.
  # 날짜가 이미 같아 커밋이 없어도 배포합니다. 직전 배포가 옛 커밋을 올렸으면 다음 갱신에서 따라잡습니다.
  deploy:
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_PUB: ${{ secrets.NEXT_PUBLIC_ADSENSE_PUB }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
